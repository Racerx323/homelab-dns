#; Pi-hole FTL config file
#; Comments should start with #; to avoid issues with PHP and bash reading this file
#; Location: /etc/pihole/pihole-FTL.conf
PRIVACYLEVEL=0
RATE_LIMIT=1000/60
#; Preserve authoritative reverse answers from the local Unbound zone.
RESOLVE_IPV6=YES
#; Pi-hole v5 PTR policy.
PIHOLE_PTR=NONE