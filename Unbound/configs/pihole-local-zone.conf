## Local authoritative DNS data for the pihole Unbound deployment.
## File location: /etc/unbound/unbound.conf.d/pihole-local-zone.conf
##
## Keep this file synchronized across both Pi-hole/Unbound HA nodes.
## Debian's main unbound.conf loads this as a top-level *.conf file, so this
## fragment intentionally has its own server clause.

server:
    # Permit private addresses in answers for this internal namespace.
    private-domain: "local.theama.co"

    # The internal zone is unsigned and must not inherit a public DNSSEC chain.
    domain-insecure: "local.theama.co"

    # Answer authoritatively from the records below. Unknown names return
    # NXDOMAIN instead of leaking into public DNS.
    local-zone: "local.theama.co." static

    # Service records
    local-data: "_https._tcp.proxy.local.theama.co. 180 IN SRV 0 0 443 proxy.local.theama.co."
    local-data: "_smtp._tcp.local.theama.co. 180 IN SRV 0 10 8025 mailrise.local.theama.co."

    # Forward records
    local-data: "j2-svpi4mf.local.theama.co. IN A 10.1.2.170"
    local-data: "j2-svpi4mf.local.theama.co. IN AAAA fd36:5aa8:6971:1::170"
    local-data: "exn-ff-apm.local.theama.co. IN A 10.1.0.17"
    local-data: "exs-cf-apm.local.theama.co. IN A 10.1.0.18"
    local-data: "f-a1-aphd.local.theama.co. IN A 10.1.0.15"
    local-data: "homeassistant.local.theama.co. IN A 10.1.2.120"
    local-data: "j2-sppdu1.local.theama.co. IN A 10.1.0.32"
    local-data: "j2-sw24xgpoe.local.theama.co. IN A 10.1.0.7"
    local-data: "j2-sw48poe.local.theama.co. IN A 10.1.0.6"
    local-data: "j2-sw8agg.local.theama.co. IN A 10.1.0.5"
    local-data: "lora.local.theama.co. IN A 10.1.0.52"
    # local-data: "loratest.local.theama.co. IN A 10.1.1.124"
    local-data: "mailrise.local.theama.co. IN A 10.1.3.83"
    local-data: "munin.local.theama.co. IN A 10.1.3.83"
    local-data: "ntp.local.theama.co. IN A 10.1.0.50"
    local-data: "ntp1.local.theama.co. IN A 10.1.0.51"
    local-data: "p-a1-aphd.local.theama.co. IN A 10.1.0.16"
    local-data: "p-d1-sw8lpoe.local.theama.co. IN A 10.1.0.9"
    local-data: "p-d2-sw8lpoe.local.theama.co. IN A 10.1.0.8"

    # Pi-hole/keepalived HA records:
    # - pihole.local.theama.co is the keepalived VIP used by DNS clients.
    # - pihole0 and pihole00 are the individual Pi-hole/Unbound nodes.
    local-data: "pihole.local.theama.co. IN A 10.1.0.55"
    local-data: "pihole.local.theama.co. IN AAAA fd36:5aa8:6971:1::55"
    local-data: "pihole0.local.theama.co. IN A 10.1.0.53"
    local-data: "pihole0.local.theama.co. IN AAAA fd36:5aa8:6971:1::53"
    local-data: "pihole00.local.theama.co. IN A 10.1.0.54"
    local-data: "pihole00.local.theama.co. IN AAAA fd36:5aa8:6971:1::54"

    # Caddy/keepalived HA records
    local-data: "pihole-admin.local.theama.co. IN A 10.1.0.56"
    local-data: "pihole-admin.local.theama.co. IN AAAA fd36:5aa8:6971:1::56"
    local-data: "proxy.local.theama.co. IN A 10.1.0.56"
    local-data: "proxy.local.theama.co. IN AAAA fd36:5aa8:6971:1::56"
    local-data: "svmf.local.theama.co. IN A 10.1.3.83"
    local-data: "sw5fmini.local.theama.co. IN A 10.1.0.10"
    local-data: "udmbt.local.theama.co. IN A 10.1.0.1"
    local-data: "volumio.local.theama.co. IN A 10.1.0.48"

    # Reverse records. Where several names share an address, publish one
    # canonical PTR target to avoid ambiguous reverse-DNS results.
    local-data-ptr: "10.1.0.17 exn-ff-apm.local.theama.co."
    local-data-ptr: "10.1.0.18 exs-cf-apm.local.theama.co."
    local-data-ptr: "10.1.0.15 f-a1-aphd.local.theama.co."
    local-data-ptr: "10.1.2.120 homeassistant.local.theama.co."
    local-data-ptr: "10.1.0.32 j2-sppdu1.local.theama.co."
    local-data-ptr: "10.1.0.7 j2-sw24xgpoe.local.theama.co."
    local-data-ptr: "10.1.2.170 j2-svpi4mf.local.theama.co."
    local-data-ptr: "fd36:5aa8:6971:1::170 j2-svpi4mf.local.theama.co."
    local-data-ptr: "10.1.0.6 j2-sw48poe.local.theama.co."
    local-data-ptr: "10.1.0.5 j2-sw8agg.local.theama.co."
    local-data-ptr: "10.1.0.52 lora.local.theama.co."
    # local-data-ptr: "10.1.1.124 loratest.local.theama.co."
    local-data-ptr: "10.1.0.50 ntp.local.theama.co."
    local-data-ptr: "10.1.0.51 ntp1.local.theama.co."
    local-data-ptr: "10.1.0.16 p-a1-aphd.local.theama.co."
    local-data-ptr: "10.1.0.9 p-d1-sw8lpoe.local.theama.co."
    local-data-ptr: "10.1.0.8 p-d2-sw8lpoe.local.theama.co."
    local-data-ptr: "10.1.0.55 pihole.local.theama.co."
    local-data-ptr: "fd36:5aa8:6971:1::55 pihole.local.theama.co."
    local-data-ptr: "10.1.0.56 proxy.local.theama.co."
    local-data-ptr: "fd36:5aa8:6971:1::56 proxy.local.theama.co."
    local-data-ptr: "10.1.0.53 pihole0.local.theama.co."
    local-data-ptr: "fd36:5aa8:6971:1::53 pihole0.local.theama.co."
    local-data-ptr: "10.1.0.54 pihole00.local.theama.co."
    local-data-ptr: "fd36:5aa8:6971:1::54 pihole00.local.theama.co."
    local-data-ptr: "10.1.3.83 svmf.local.theama.co."
    local-data-ptr: "10.1.0.10 sw5fmini.local.theama.co."
    local-data-ptr: "10.1.0.1 udmbt.local.theama.co."
    local-data-ptr: "10.1.0.48 volumio.local.theama.co."
