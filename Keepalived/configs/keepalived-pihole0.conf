# Pi-Hole primary DNS server Keepalived config
# /etc/keepalived/keepalived.conf
global_defs {
    router_id j1-svpihole0
    script_user pi
    enable_script_security
    enable_dbus
    vrrp_check_unicast_src
    vrrp_version 3
}

vrrp_script check-dns {
    script "/etc/scripts/check-dns.sh"
    interval 3
    timeout 2
    rise 3
    fall 2
}

vrrp_script check-caddy {
    script "/usr/local/libexec/check-caddy.sh"
    user keepalived_script
    interval 3
    timeout 2
    rise 3
    fall 2
}

vrrp_sync_group PIHOLE_DUALSTACK {
    group {
        PIHOLE_IPV4
        PIHOLE_IPV6
    }

    track_script {
        check-dns
        check-caddy
    }

    # Notify once for the synchronized IPv4 and IPv6 state transition.
    notify "/usr/local/bin/keepalived-notify.sh"
}

vrrp_instance PIHOLE_IPV4 {
    # Start in BACKUP so preempt_delay applies; priority selects the preferred node.
    state BACKUP
    interface eth0
    virtual_router_id 100
    priority 150
    advert_int 0.5

    # Delay reclaiming MASTER after recovery to reduce failback flapping.
    preempt_delay 10

    unicast_src_ip 10.1.0.53
    unicast_ttl 255
    track_src_ip
    unicast_peer {
        10.1.0.54 min_ttl 255 max_ttl 255
    }

    virtual_ipaddress {
        10.1.0.55/22 dev eth0
    }

    # Installed with DNS ownership but omitted from VRRP advertisements.
    virtual_ipaddress_excluded {
        # The shared Caddy VIP follows coupled DNS/Caddy serving health.
        10.1.0.56/22 dev eth0
    }
}

# IPv6 Instance
vrrp_instance PIHOLE_IPV6 {
    # Start in BACKUP so preempt_delay applies; priority selects the preferred node.
    state BACKUP
    interface eth0
    virtual_router_id 101
    priority 150
    advert_int 0.5

    # Delay reclaiming MASTER after recovery to reduce failback flapping.
    preempt_delay 10

    unicast_src_ip fd36:5aa8:6971:1::53
    unicast_ttl 255
    track_src_ip
    unicast_peer {
        fd36:5aa8:6971:1::54 min_ttl 255 max_ttl 255
    }

    virtual_ipaddress {
        fd36:5aa8:6971:1::55/128 dev eth0 preferred_lft forever
    }

    # Installed with DNS ownership but omitted from VRRP advertisements.
    virtual_ipaddress_excluded {
        # The shared Caddy VIP follows coupled DNS/Caddy serving health.
        fd36:5aa8:6971:1::56/128 dev eth0 preferred_lft forever
    }
}
