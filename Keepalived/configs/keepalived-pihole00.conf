# Pi-Hole secondary DNS server Keepalived config
# /etc/keepalived/keepalived.conf
global_defs {
    router_id j1-svpihole00
    script_user pi
    enable_script_security
    enable_dbus
    vrrp_check_unicast_src
    vrrp_version 3
}

vrrp_script check-dns {
    script "/etc/scripts/check-dns.sh"
    interval 1
    timeout 3
    rise 3
    fall 3
}

vrrp_sync_group PIHOLE_DUALSTACK {
    group {
        PIHOLE_IPV4
        PIHOLE_IPV6
    }

    track_script {
        check-dns
    }

    # Notify once for the synchronized IPv4 and IPv6 state transition.
    notify "/usr/local/bin/keepalived-notify.sh"
}

vrrp_instance PIHOLE_IPV4 {
    state BACKUP
    interface eth0
    virtual_router_id 100
    priority 100
    advert_int 0.5

    # Delay takeover by the higher-priority node to reduce failback flapping.
    preempt_delay 10

    unicast_src_ip 10.1.0.54
    track_src_ip
    unicast_peer {
        10.1.0.53
    }

    virtual_ipaddress {
        10.1.0.55/22 dev eth0
    }
}

# IPv6 Instance
vrrp_instance PIHOLE_IPV6 {
    state BACKUP
    interface eth0
    virtual_router_id 101
    priority 100
    advert_int 0.5

    # Delay takeover by the higher-priority node to reduce failback flapping.
    preempt_delay 10

    unicast_src_ip fd36:5aa8:6971:1::54
    track_src_ip
    unicast_peer {
        fd36:5aa8:6971:1::53
    }

    virtual_ipaddress {
        fd36:5aa8:6971:1::55/128 dev eth0 preferred_lft forever
    }
}
